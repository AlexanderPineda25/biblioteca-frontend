name: Frontend AKS CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NAMESPACE: biblioteca
  KUSTOMIZE_OVERLAY: ${{ vars.KUSTOMIZE_OVERLAY || 'k8s/overlays/aks-no-domain' }}
  IMAGE_NAME: biblioteca/frontend

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_AUTH_SERVICE_URL: ${{ vars.VITE_AUTH_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}
          VITE_CATALOG_SERVICE_URL: ${{ vars.VITE_CATALOG_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}
          VITE_CHATBOT_SERVICE_URL: ${{ vars.VITE_CHATBOT_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}
        run: npm run build

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize
        run: |
          OVERLAY="$(printf '%s' "$KUSTOMIZE_OVERLAY" | tr -d '\n\r')"
          echo "Using overlay: '$OVERLAY'"
          kubectl kustomize "$OVERLAY" > /tmp/frontend-rendered.yaml

  build-and-deploy:
    name: Build image and deploy to AKS
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          missing=0
          for name in AKS_RESOURCE_GROUP AKS_CLUSTER_NAME ACR_NAME ACR_LOGIN_SERVER AZURE_CREDENTIALS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for frontend deployment"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push frontend image
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }}"
          docker build \
            --build-arg VITE_AUTH_SERVICE_URL="${{ vars.VITE_AUTH_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}" \
            --build-arg VITE_CATALOG_SERVICE_URL="${{ vars.VITE_CATALOG_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}" \
            --build-arg VITE_CHATBOT_SERVICE_URL="${{ vars.VITE_CHATBOT_SERVICE_URL || vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Deploy frontend manifests
        run: |
          OVERLAY="$(printf '%s' "$KUSTOMIZE_OVERLAY" | tr -d '\n\r')"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          MANIFEST=/tmp/frontend-rendered.yaml
          echo "Using overlay: '$OVERLAY'"
          kubectl kustomize "$OVERLAY" > "$MANIFEST"
          sed -i "s|image: .*frontend:.*|image: ${{ vars.ACR_LOGIN_SERVER }}/${IMAGE_NAME}:${{ github.sha }}|" "$MANIFEST"
          kubectl apply -f "$MANIFEST"

      - name: Wait for rollout
        run: kubectl rollout status deployment/biblioteca-frontend --namespace "$NAMESPACE" --timeout=180s

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Rollout failed. Initiating rollback..."
          kubectl rollout undo deployment/biblioteca-frontend --namespace "$NAMESPACE" 2>/dev/null || true
          echo "⏳ Waiting for rollback to complete..."
          kubectl rollout status deployment/biblioteca-frontend --namespace "$NAMESPACE" --timeout=180s 2>/dev/null || true
          echo "✅ Rollback completed (or attempted)"
          echo "ROLLBACK_TRIGGERED=true" >> $GITHUB_ENV

      - name: Health check post-deploy
        run: |
          echo "Waiting for ingress to be ready..."
          sleep 10
          PUBLIC_URL="$(printf '%s' "${{ vars.PUBLIC_BASE_URL || 'https://bibliotechu.duckdns.org' }}" | tr -d '\n\r')"
          echo "Checking $PUBLIC_URL ..."
          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
              echo "✅ Frontend health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  Attempt $i: HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          echo "❌ Frontend health check failed after 12 attempts"
          exit 1
